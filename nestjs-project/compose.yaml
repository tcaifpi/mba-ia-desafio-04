version: '3.8'

services:
  # Banco de Dados PostgreSQL
  db:
    image: postgres:17
    container_name: nestjs-project-db-1
    environment:
      POSTGRES_USER: streamtube_user
      POSTGRES_PASSWORD: streamtube_password
      POSTGRES_DB: streamtube
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nestjs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube_user -d streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API NestJS
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nestjs-project-nestjs-api-1
    user: "root" # Força o uso do usuário root dentro do container para evitar EACCES no npm install
    ports:
      - "3000:3000"
    volumes:
      - .:/home/node/app
      - /home/node/app/node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_started
    networks:
      - nestjs-network

  # Object Storage (MinIO)
  storage:
    image: minio/minio:latest
    container_name: streamtube-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: streamtube_admin
      MINIO_ROOT_PASSWORD: streamtube_password
    command: server /data --console-address ":9001"
    networks:
      - nestjs-network

  # Message Queue Backend (Redis)
  queue:
    image: redis:7-alpine
    container_name: streamtube-queue
    ports:
      - "6379:6379"
    networks:
      - nestjs-network

# Video Processing Worker
  nestjs-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: nestjs-project-worker-1
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_started
      storage:
        condition: service_started
    networks:
      - nestjs-network

volumes:
  pgdata:

networks:
  nestjs-network:
    driver: bridge
